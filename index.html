<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Info portal — Where we are now</title>
<meta name="description" content="Information portal for the International M.Ed. in Inclusive Education at Oranim Academic College: where each course has got to, and inclusive education in the media.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a masthead, one card per course in a two-up grid that stacks at phone
   width, then a media section below it where the week's featured piece sits first. */
:root{
  --paper:#f4f6f3;
  --card:#fffffe;
  --ink:#1a211d;
  --muted:#5e6b63;
  --line:#dde3dc;
  --accent:#2f5d47;
  --accent-soft:#e6efe8;
  --display:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --body:"Assistant","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#121715;--card:#1a211d;--ink:#e7ece8;--muted:#9ba79f;--line:#2b342e;
    --accent:#86bb9f;--accent-soft:#1e2b24;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:36px 56px}
img{max-width:100%}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto}

.masthead{border-bottom:2px solid var(--accent);padding-bottom:18px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:0 0 9px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.15;
  margin:0;text-wrap:balance}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.course{background:var(--card);border:1px solid var(--line);border-radius:4px;
  display:flex;flex-direction:column;min-width:0}
.c-top{padding:15px 17px 13px;border-bottom:1px solid var(--line);min-width:0}
.c-en{font-size:15px;font-weight:700;line-height:1.3;margin:0 0 3px}
.c-who{font-size:12.5px;color:var(--muted);margin:0}
.c-body{padding:15px 17px;display:flex;flex-direction:column;gap:13px;flex:1;min-width:0}
.unit{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;margin:0}
.unit.none{font-size:15px;color:var(--muted);font-weight:500}
.row{min-width:0}
.k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:0 0 3px}
.v{font-size:13.5px;margin:0;overflow-wrap:anywhere}
.v.none{color:var(--muted)}
.date{font-variant-numeric:tabular-nums;font-weight:600}
.c-foot{padding:10px 17px;border-top:1px solid var(--line)}
.ago{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.media{margin-top:34px;border-top:2px solid var(--accent);padding-top:20px}
.media h2{font-family:var(--display);font-size:clamp(19px,2.6vw,24px);font-weight:700;
  margin:0 0 4px;line-height:1.2}
.media .lede{font-size:12.5px;color:var(--muted);margin:0 0 18px;max-width:62ch}
.pieces{display:flex;flex-direction:column;gap:14px}
.piece{background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:17px 19px;min-width:0}
.piece.featured{background:var(--accent-soft);border-color:var(--accent)}
.flag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--accent);margin:0 0 7px}
.p-title{font-family:var(--display);font-size:clamp(17px,2.3vw,21px);font-weight:700;
  line-height:1.25;margin:0 0 6px;text-wrap:balance}
.p-title a{text-decoration:none;color:var(--ink);border-bottom:2px solid var(--accent)}
.p-title a:hover{color:var(--accent)}
.p-meta{font-size:12px;color:var(--muted);margin:0 0 9px}
.p-note{font-size:13.5px;margin:0;max-width:72ch}
.media .empty{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">International M.Ed. in Inclusive Education &middot; Oranim</p>
    <h1>Info portal &mdash; Where we are now</h1>
  </header>

  <div id="board"></div>

  <section class="media">
    <h2>Inclusive education in the media</h2>
    <p class="lede">Articles and videos from outside the reading list. One piece is featured each week.</p>
    <div id="pieces"></div>
  </section>
</div>

<script>
(function(){
  var board = document.getElementById('board');
  var pieces = document.getElementById('pieces');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function today(){ return new Date().toISOString().slice(0, 10); }
  function days(from, to){
    var a = Date.parse(from + 'T00:00:00'), b = Date.parse(to + 'T00:00:00');
    if (isNaN(a) || isNaN(b)) return null;
    return Math.round((b - a) / 86400000);
  }
  function pretty(iso){
    var t = Date.parse(iso + 'T00:00:00');
    if (isNaN(t)) return '';
    return new Date(t).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
  }
  function ago(c){
    if (!c.updated) return 'Not updated yet';
    var n = days(c.updated, today());
    if (n == null) return 'Not updated yet';
    return n <= 0 ? 'Updated today' : n === 1 ? 'Updated yesterday' : 'Updated ' + n + ' days ago';
  }
  function safeUrl(u){
    u = String(u == null ? '' : u);
    return /^https?:\/\//i.test(u) ? u : '';
  }

  // An empty field hides its row entirely, rather than printing a placeholder.
  function row(label, value, cls){
    if (!value) return '';
    return '<div class="row"><p class="k">' + label + '</p>'
      + '<p class="' + (cls || 'v') + '">' + esc(value) + '</p></div>';
  }
  function isDate(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v == null ? '' : v)); }

  // `next` may be a date (YYYY-MM-DD), which gets a countdown, or free text, shown as written.
  function nextText(v){
    if (!v) return '';
    if (!isDate(v)) return v;
    var n = days(today(), v);
    return pretty(v) + (n === null ? '' : n === 0 ? ' — today' : n === 1 ? ' — tomorrow'
      : n > 1 ? ' — in ' + n + ' days' : ' — overdue');
  }

  function card(c){
    var unit = String(c.unit == null ? '' : c.unit);
    return '<article class="course">'
      + '<div class="c-top">'
      + '<p class="c-en">' + esc(c.en) + '</p>'
      + '<p class="c-who">' + esc(c.who) + '</p>'
      + '</div><div class="c-body">'
      + row('Unit we are on', unit, unit.length <= 18 ? 'unit' : 'v')
      + row('What to do now', c.now)
      + row('Next thing due', c.due)
      + row('Next update expected', nextText(c.next), isDate(c.next) ? 'v date' : 'v')
      + '</div><div class="c-foot"><span class="ago">' + esc(ago(c)) + '</span></div>'
      + '</article>';
  }

  function piece(p, first){
    var url = safeUrl(p.url);
    var meta = [p.source, p.byline, p.date].filter(Boolean).map(esc).join(' &middot; ');
    var head = url
      ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(p.title) + '</a>'
      : esc(p.title);
    return '<article class="piece' + (first ? ' featured' : '') + '">'
      + (first ? '<p class="flag">This week</p>' : '')
      + '<p class="p-title">' + head + '</p>'
      + (meta ? '<p class="p-meta">' + meta + '</p>' : '')
      + (p.note ? '<p class="p-note">' + esc(p.note) + '</p>' : '')
      + '</article>';
  }

  function render(data){
    var list = (data && data.courses) || [];
    var h = '';
    for (var i = 0; i < list.length; i++) h += card(list[i]);
    board.innerHTML = list.length
      ? '<div class="grid">' + h + '</div>'
      : '<p class="empty">No courses are listed yet.</p>';

    var m = (data && data.media) || [], mh = '';
    for (var j = 0; j < m.length; j++) mh += piece(m[j], j === 0);
    pieces.innerHTML = m.length
      ? '<div class="pieces">' + mh + '</div>'
      : '<p class="empty">Nothing featured this week.</p>';
  }

  fetch('status.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(render)
    .catch(function(){
      board.innerHTML = '<p class="empty">The board could not load just now. '
        + 'Refresh the page, and if it still does not appear, write to Tal.</p>';
    });
})();
</script>
</body>
</html>
